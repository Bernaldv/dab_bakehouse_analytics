# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 29669522-4683-484c-8536-96dc05d27669

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse que ejecuta las consultas del dashboard
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405607748455055.15.azuredatabricks.net
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
      warehouse_id: 3207abf2a48f4191
  prod:
    mode: production
    workspace:
      host: https://adb-7405607135943069.9.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/diana.bernalt@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/diana.bernalt@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: rnd
      warehouse_id: 010d462bd66fa73b
    permissions:
      - user_name: diana.bernalt@outlook.com
        level: CAN_MANAGE
